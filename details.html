<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Record Details</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🥛 Milk Record Details</h1>

        <div class="form-container">

            <h2>Running Total</h2>

            <h1 id="runningTotal">₹0</h1>

            <hr><br>

            <p><strong>Entry ID :</strong> <span id="entryId"></span></p>

            <p><strong>Member ID :</strong> <span id="memberId"></span></p>

            <p><strong>Member Name :</strong> <span id="memberName"></span></p>

            <p><strong>Date :</strong> <span id="date"></span></p>

            <p><strong>Session :</strong> <span id="session"></span></p>

            <p><strong>Quantity :</strong> <span id="quantity"></span> Litres</p>

            <p><strong>Fat % :</strong> <span id="fat"></span></p>

            <p><strong>Rate :</strong> ₹<span id="rate"></span></p>

            <p><strong>Amount :</strong> ₹<span id="amount"></span></p>

            <br>

            <button onclick="goBack()">⬅ Back</button>

        </div>

    </div>
    <script src="milkData.js"></script>
    <script src="details.js"></script>
</body>

</html>
